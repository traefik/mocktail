version: "2"
linters:
  default: all
  disable:
    - bodyclose
    - contextcheck
    - cyclop
    - dupl
    - err113
    - errchkjson
    - exhaustive
    - exhaustruct
    - exhaustruct_v5
    - forcetypeassert
    - gomodguard # deprecated, replaced by gomodguard_v2
    - ireturn
    - lll
    - mnd
    - nilnil
    - nlreturn
    - paralleltest
    - prealloc
    - rowserrcheck
    - sqlclosecheck
    - testpackage
    - tparallel
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/instana/testify
              desc: not allowed
            - pkg: github.com/pkg/errors
              desc: Should be replaced by standard lib errors package
    funlen:
      lines: -1
      statements: 50
    goconst:
      min-len: 5
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - sloppyReassign
        - rangeValCopy
        - octalLiteral
        - paramTypeCombine
        - unnamedResult
        - hugeParam
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocyclo:
      min-complexity: 15
    godox:
      keywords:
        - FIXME
    gosec:
      excludes:
        - G304
        - G306
    govet:
      disable:
        - fieldalignment
      enable-all: true
    misspell:
      locale: US
    tagliatelle:
      case:
        rules:
          json: pascal
  exclusions:
    generated: lax
    rules:
      - linters:
          - funlen
          - noctx
        path: .*_test.go
      - path: (.+)\.go$
        text: fmt.Sprintf can be replaced with string
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
